[package]
name = "ai_code_analyzer"
version = "0.1.0"
edition = "2024"

[lib]
name = "ai_code_analyzer"
path = "src/lib.rs"

[[bin]]
name = "ai_code_analyzer"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-python = "0.23"
# Derleyicinin istediği harici kütüphane:
streaming-iterator = "0.1"
# Paralel dosya işleme için
rayon = "1.8"
# JSON serileştirme ve zaman damgası
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"